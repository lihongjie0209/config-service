syntax = "proto3";

package hello.v1;

option go_package = "github.com/lihongjie0209/config-service/gen/hello/v1;hellov1";

service HelloService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string version = 2;
}

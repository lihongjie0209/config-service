# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: true
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: config
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths: [/api/v1/config/entries/put-draft, /api/v1/config/entries/submit, /api/v1/config/entries/approve, /api/v1/config/entries/reject, /api/v1/config/entries/publish, /api/v1/config/entries/rollback]
  grpc_methods: [/platform.config.v1.ConfigService/PutDraft, /platform.config.v1.ConfigService/SubmitForApproval, /platform.config.v1.ConfigService/Approve, /platform.config.v1.ConfigService/Reject, /platform.config.v1.ConfigService/Publish, /platform.config.v1.ConfigService/Rollback]
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
outbound:
  grpc:
    application:
      target: application-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: application-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
    authorization:
      target: authorization-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: authorization-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
